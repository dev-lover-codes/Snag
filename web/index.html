<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build --base-href`; keep the slashes. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Snag it now, find it later. Save notes, links, images and PDFs, chat, keep files and plan events.">
  <meta name="theme-color" content="#0F766E">
  <meta name="color-scheme" content="light dark">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Snag">

  <link rel="icon" type="image/svg+xml" href="icons/snag.svg">
  <link rel="apple-touch-icon" href="icons/snag.svg">
  <link rel="manifest" href="manifest.json">
  <!-- Start fetching the database module while the app script loads. -->
  <link rel="preload" href="sqlite3.wasm" as="fetch" type="application/wasm" crossorigin>

  <title>Snag</title>

  <style>
    :root { --bg: #F4FBF9; --fg: #171D1C; --muted: #3F4947; --accent: #0F766E; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0E1514; --fg: #DDE4E2; --muted: #BEC9C6; --accent: #5ED6C6; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg); background: var(--bg);
      transition: opacity 240ms ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; }
    #splash h1 { margin: 6px 0 0; font-size: 28px; font-weight: 700; }
    #splash p { margin: 0; color: var(--muted); font-size: 15px; }
    #splash .bar {
      width: 140px; height: 3px; margin-top: 18px; border-radius: 3px;
      background: color-mix(in srgb, var(--accent) 20%, transparent); overflow: hidden;
    }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: var(--accent); border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading Snag">
    <img src="icons/snag.svg" alt="">
    <h1>Snag</h1>
    <p>Snag it now, find it later.</p>
    <div class="bar"></div>
  </div>
  <script>
    // Fade the splash out once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('done');
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
